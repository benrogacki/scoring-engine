# Live freight nowcast: fetch real data from the publishers, run, publish.
#
# Publish-on-release: the schedule checks every 3 hours, but a run only commits
# to freight-live (and redeploys the Pages dashboard) when the numbers changed,
# i.e. a source released new data or revised old data. The commit message lists
# which series moved. Sources release on their own calendars (PortWatch
# Tuesdays, Destatis daily toll index Thursdays, Eurostat/FRED/CPB monthly), so
# polling catches each release within a few hours.
#
# Also runs on demand (Actions -> Freight nowcast -> Run workflow) and on pushes
# that change the nowcaster (a live smoke test of every source); those always
# publish. Scheduled runs only fire from the default branch.
#
# Secrets (optional): DESTATIS_TOKEN — a free GENESIS-Online token. Without it
# the GENESIS guest login is used, which is rate-limited.
name: Freight nowcast

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Commit outputs to the freight-live branch"
        type: boolean
        default: true
  push:
    paths:
      - "freight_nowcast/**"
      - "config/freight_nowcast.json"
      - ".github/workflows/freight-nowcast.yml"

permissions:
  contents: write

concurrency:
  group: freight-nowcast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    env:
      DESTATIS_TOKEN: ${{ secrets.DESTATIS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Restore live cache (keeps the last good copy of each series)
        uses: actions/cache@v4
        with:
          path: data/freight
          key: freight-cache-${{ github.run_id }}
          restore-keys: freight-cache-

      - name: Probe every source
        run: python -m freight_nowcast probe | tee probe.log
        continue-on-error: true

      - name: Fetch and run on live data
        run: python -m freight_nowcast live --out out/freight/live

      - name: Job summary
        if: always()
        run: |
          if [ -f out/freight/live/nowcast_summary.md ]; then cat out/freight/live/nowcast_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          { echo; echo '<details><summary>Source probe</summary>'; echo; echo '```'; cat probe.log 2>/dev/null; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freight-nowcast-live
          path: |
            out/freight/live
            data/freight/live
            probe.log
          if-no-files-found: warn

      - name: Build the dashboard site
        if: always()
        run: |
          mkdir -p site
          if [ -f out/freight/live/dashboard.html ]; then
            cp out/freight/live/dashboard.html site/index.html
            cp out/freight/live/*.json out/freight/live/*.csv out/freight/live/*.md site/ 2>/dev/null || true
          fi

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

      - name: Publish to the freight-live branch (only when the numbers changed)
        id: publish
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: |
          git config user.name "freight-nowcast bot"
          git config user.email "freight-nowcast@users.noreply.github.com"
          git fetch origin freight-live || true
          if git rev-parse --verify origin/freight-live >/dev/null 2>&1; then
            git worktree add publish origin/freight-live
          else
            git worktree add --detach publish && (cd publish && git checkout --orphan freight-live && git rm -rfq .)
          fi
          new=$(cat out/freight/live/data_fingerprint.txt 2>/dev/null || echo missing)
          old=$(cat publish/live/data_fingerprint.txt 2>/dev/null || echo none)
          python -m freight_nowcast changes publish/live/_manifest.json data/freight/live/_manifest.json > releases.txt || true
          if [ "$new" = "$old" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "No new data since the last publish; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            { echo; echo "**No new data since the last publish.**"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          { echo; echo "### New data in this run"; echo; sed 's/^/- /' releases.txt; } >> "$GITHUB_STEP_SUMMARY"
          rm -rf publish/live && mkdir -p publish/live
          cp -r out/freight/live/. publish/live/
          cp data/freight/live/_manifest.json publish/live/ 2>/dev/null || true
          cd publish
          git add -A
          git commit -qm "Live freight nowcast $(date -u +%Y-%m-%dT%H:%MZ)" -m "New data:" -m "$(cat ../releases.txt)" \
            || { echo "no changes"; exit 0; }
          git push origin HEAD:freight-live

  # Serves the live dashboard on GitHub Pages. Needs Pages enabled once
  # (Settings -> Pages -> Source: GitHub Actions); the default github-pages
  # environment only deploys from the default branch, so runs on other
  # branches skip this without failing the workflow.
  pages:
    needs: live
    if: >-
      needs.live.outputs.changed == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
