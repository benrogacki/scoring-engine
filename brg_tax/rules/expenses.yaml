  - id: EXP-TRAIN-02
    title: Training for a new skill or qualification
    question: Does the training give the trader a new skill or qualification (capital / personal)?
    conditions: {category: training}
    outcome: {ct: review}
    certainty: judgment
    authority: ["ITTOIA 2005 s33", "ITTOIA 2005 s34"]
    guidance: ["BIM35660", "BIM42526"]
    entity_types: [sole_trader]
    effective: {from: "2005-04-06", to: null}
    params: []
    factors:
      - Is the course connected to the trade as currently carried on?
      - Does it create an asset of enduring benefit (a new qualification, new trade)?
      - Is there a personal benefit beyond the trade?
    authorities:
      - "Dass v Special Commissioner [2006] EWHC 2491 (Ch)"
      - "Consultant Psychiatrist v HMRC [2006] SpC 557"
    default: {ct: disallow}
    reasoning: For a sole trader, training with no recorded link to existing skills is treated as capital/personal until confirmed.
    notes: For a company, training of employees is generally allowable (and exempt for the employee under ITEPA s250).

