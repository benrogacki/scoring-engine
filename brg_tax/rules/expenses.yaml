      Sole traders with private use: record private_use_pct (EXP-PRIV-01). Company cars with private use
      create a car/fuel benefit for the director (P11D) and may need the VAT fuel scale charge.

  - id: EXP-DON-01
    title: Charitable donations
    question: Is this a donation to a charity?
    conditions: {category: donations}
    outcome: {ct: disallow, vat: none}
    certainty: rule
    authority: ["CTA 2009 s54", "CTA 2010 s189", "ITA 2007 s414"]
    guidance: ["BIM47405", "CTM10000"]
    entity_types: [company, sole_trader]
    effective: {from: "2005-04-06", to: null}
    params: []
    notes: >-
      Not a trading expense. A company deducts qualifying charitable donations from total profits
      (CTA 2010 s189 - applied in the CT computation); a sole trader claims Gift Aid through the return.

  - id: EXP-PEN-01
    title: Employer pension contributions
    question: Is this an employer contribution to a registered pension scheme, paid in the period?
    conditions: {category: director_pension}
    outcome: {ct: allow, vat: none}
    certainty: rule
    authority: ["CTA 2009 s1290", "FA 2004 s196", "FA 2004 s197"]
    guidance: ["BIM46001", "BIM46035"]
    entity_types: [company]
    effective: {from: "2006-04-06", to: null}
    params: []
    notes: >-
      Deductible when paid. Large contributions may be spread (FA 2004 s197). Contributions for a
      director-shareholder are tested for wholly and exclusively only where the overall package is
      excessive for the work done (BIM46035) - escalate in the review queue if that is in doubt.

  - id: EXP-RD-01
    title: Research and development costs
    question: Is this a revenue cost of research and development related to the trade?
    conditions: {category: research_development}
    outcome: {ct: allow, vat: recover}
    certainty: rule
    authority: ["CTA 2009 s87", "CTA 2009 s54"]
    guidance: ["CIRD81000"]
    entity_types: [company, sole_trader]
    effective: {from: "2009-04-01", to: null}
    params: []
    notes: >-
      Deductible as revenue expenditure. Whether R&D relief (RDEC / ERIS) is available is a separate
      judgment raised once per period by CT-RD-01 and is not computed in v1.

